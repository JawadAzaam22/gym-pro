name: Deploy backend (Supabase)

# Manual on purpose: database changes are never pushed by accident.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [production, staging]
        default: production
      confirm:
        description: Type DEPLOY to confirm
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    if: ${{ inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Check configuration
        run: |
          [ -n "$PROJECT_REF" ] || { echo "::error::Variable SUPABASE_PROJECT_REF is not set for this environment"; exit 1; }
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Secret SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          [ -n "$SUPABASE_DB_PASSWORD" ] || { echo "::error::Secret SUPABASE_DB_PASSWORD is not set"; exit 1; }

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show pending migrations (dry run)
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy create-user --project-ref "$PROJECT_REF"
          supabase functions deploy delete-user --project-ref "$PROJECT_REF"
