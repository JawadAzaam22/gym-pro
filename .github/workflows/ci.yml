name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.24.5

jobs:
  # ---------------------------------------------------------------------
  # 1. Nothing secret may reach the repository
  # ---------------------------------------------------------------------
  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ---------------------------------------------------------------------
  # 2. Flutter: format, analyze, test, build
  # ---------------------------------------------------------------------
  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # .env is a bundled asset: the build needs the file, not real values.
      - name: Create .env from the template
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Format check (advisory)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis (advisory)
        continue-on-error: true
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Custom lint / Riverpod rules (advisory)
        continue-on-error: true
        run: dart run custom_lint

      - name: Unit tests (required)
        timeout-minutes: 10
        run: >
          flutter test --no-pub --coverage
          test/core test/domain test/models test/repositories test/utils

      - name: Widget tests (advisory)
        continue-on-error: true
        timeout-minutes: 10
        run: >
          flutter test --no-pub
          test/presentation test/screens
          test/drawer_hit_test.dart test/drawer_nav_test.dart test/widget_test.dart

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

      - name: Build web - admin (required)
        run: flutter build web --release -t lib/main_admin.dart

      - name: Build web - reception (required)
        run: flutter build web --release -t lib/main_reception.dart

      - name: Build Android debug APK
        if: ${{ hashFiles('android/app/build.gradle', 'android/app/build.gradle.kts') != '' }}
        run: flutter build apk --debug -t lib/main_mobile.dart

  # ---------------------------------------------------------------------
  # 3. Database: every migration from scratch + integration tests
  # ---------------------------------------------------------------------
  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase (applies all migrations on an empty database)
        run: supabase start

      - name: Integration tests (security, attendance, QR, booking)
        run: |
          shopt -s nullglob
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          files=(supabase/tests/database/*.test.sql)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no database tests found"; exit 1; }
          for f in "${files[@]}"; do
            echo "::group::$f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Database lint (advisory)
        continue-on-error: true
        run: supabase db lint

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  # ---------------------------------------------------------------------
  # 4. Edge Functions type-check
  # ---------------------------------------------------------------------
  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check
        run: deno check supabase/functions/create-user/index.ts supabase/functions/delete-user/index.ts

  # ---------------------------------------------------------------------
  # One status for branch protection: "CI passed"
  # ---------------------------------------------------------------------
  ci-passed:
    name: CI passed
    if: always()
    needs: [secrets-scan, flutter, database, edge-functions]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::At least one required job failed"
            exit 1
          fi
