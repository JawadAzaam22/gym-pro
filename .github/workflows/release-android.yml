name: Release Android APK

# Free distribution: a signed APK attached to a GitHub Release (sideloading).
# No Google Play account is needed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.24.5

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Check project and configuration
        run: |
          [ -d android ] || { echo "::error::android/ folder is missing from the repository"; exit 1; }
          [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ] || { echo "::error::Repository variables SUPABASE_URL / SUPABASE_ANON_KEY are not set"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Write .env
        run: printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Restore signing key (optional)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          # Tolerate spaces / line breaks that sometimes get copied along with the secret.
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > android/app/release.jks \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Re-create the secret from the clipboard command."; exit 1; }
          keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::Cannot open the keystore. Check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (gympro)."; exit 1; }
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties
          echo "Keystore verified."

      - name: Signing notice
        if: ${{ env.KEYSTORE_B64 == '' }}
        run: echo "::warning::No keystore secrets found - the APK is signed with the debug key (testing only)."

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release -t lib/main_mobile.dart

      - name: Name the artifact
        run: |
          NAME="gym-pro-${GITHUB_REF_NAME//\//-}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
