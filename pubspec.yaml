name: gym_pro
description: "Gym Management System - 4 roles: Admin, Reception, Trainer, Trainee"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Backend
  supabase_flutter: ^2.5.0

  # Navigation
  go_router: ^14.0.0

  # Serialization
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # UI
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.2.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0

  # Charts
  fl_chart: ^0.69.0

  # PDF
  pdf: ^3.11.0
  printing: ^5.12.0

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.0
  dartz: ^0.10.0
  flutter_dotenv: ^5.1.0
  http: ^1.2.0 # تشخيص مؤقت لاستدعاء Edge Functions مباشرة
  flutter_local_notifications: 19.5.0
  timezone: ^0.10.0 # تبعية مباشرة لـ flutter_local_notifications (نستوردها صراحةً)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/fonts/

dependency_overrides:
  app_links: 6.3.2