name: gym_pro
description: "Gym Management System - 4 roles: Admin, Reception, Trainer, Trainee"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0

  # Backend
  supabase_flutter: ^2.5.0

  # Navigation
  go_router: ^14.0.0

  # UI
  google_fonts: ^8.2.1

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.0.0

  # Charts
  fl_chart: ^0.69.0

  # PDF
  pdf: ^3.11.0
  printing: ^5.12.0

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.0
  dartz: ^0.10.0
  flutter_dotenv: ^5.1.0
  flutter_local_notifications: 19.5.0
  timezone: ^0.10.0 # direct dependency of flutter_local_notifications that the app imports explicitly

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/fonts/

# Pins a transitive dependency of mobile_scanner. Re-check after upgrading it.
dependency_overrides:
  app_links: 6.3.2